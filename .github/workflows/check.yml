name: cents-watch
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: Cent-s_monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python check.py
        env:
          FORMAT_FILTER: "home,casa"   # @HOME and @CASA only, no @UNI
          UNI_FILTER: ""               # every university
          DATE_FILTER: ""      # December only
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      - name: Save state
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          if ! git diff --staged --quiet; then
            git commit -m "update state"
            git pull --rebase -X theirs origin main || { git rebase --abort; exit 1; }
            git push
          fi
